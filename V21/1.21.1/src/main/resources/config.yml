# =====================================================
#  Aibuild Configuration
#  Author: LuMickZi
# =====================================================
#
# language: Display language. Valid values:
#           en      (English / English)
#           zh_cn   (简体中文 / Simplified Chinese)
#
# schematic-folder: Folder inside plugins/Aibuild/ where .schem files are loaded.
#                   Default: schematics
#
# frame.enabled: Whether to render a wireframe (dashed points) showing the
#                two-point selection in-game. Disable to save performance.
#
# frame.density: Spacing (in blocks) between points drawn on each edge of
#                the selection. Lower values = denser wireframe = more entities.
#                Recommended: 1 ~ 3.
# =====================================================

language: "en"

schematic-folder: schematics

frame:
  enabled: true
  density: 2
